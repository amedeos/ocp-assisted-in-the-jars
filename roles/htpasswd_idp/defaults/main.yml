---
htpasswd_idp_kubeconfig_path: /root/kubeconfig-int

# Retries for the one-off login of every htpasswd user. The authentication
# clusteroperator rolls out new oauth-openshift pods after the OAuth CR is
# applied, and the clusteroperator wait in tasks/main.yml can pass on the
# pre-rollout status, so the login has to cover the rollout on its own.
htpasswd_idp_login_retries: 30
htpasswd_idp_login_delay: 10
htpasswd_idp_login_dir: /tmp/htpasswd-login-test.d

htpasswd_idp_users:
  - name: admin
    password: "{{ htpasswd_admin_password }}"
    cluster_role: cluster-admin
  - name: reader
    password: "{{ htpasswd_reader_password | default(htpasswd_admin_password) }}"
    cluster_role: cluster-reader
  - name: test01
    password: "{{ htpasswd_test01_password | default(htpasswd_admin_password) }}"
  - name: test02
    password: "{{ htpasswd_test02_password | default(htpasswd_admin_password) }}"
  - name: test03
    password: "{{ htpasswd_test03_password | default(htpasswd_admin_password) }}"
