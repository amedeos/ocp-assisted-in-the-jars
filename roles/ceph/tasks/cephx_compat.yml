---
# ODF ships its own Ceph client, and it is older than the container image
# cephadm bootstraps from. ODF 4.22 carries ceph 20.2.1-294 -- the same build
# as the RHEL 10 host RPM -- while registry.redhat.io/rhceph/rhceph-9-rhel9
# moved to 20.2.1-324 with the 2026-07-20 rebuild. Since that rebuild the
# cluster issues AES-256 cephx keys (type 2, base64 "Ag..."), which the older
# client cannot parse: it fails with "Malformed input [buffer:3]" and rook
# never gets past "failed get-or-create-key client.ceph-exporter", leaving the
# StorageCluster stuck in phase Error. Older ODF is worse, not better: 4.18
# carries ceph-csi 19.2.1 (squid) and 4.16 is older still, so no version this
# repo targets can read an AES-256 key.
#
# The monmap of the new image allows only the aes256k cipher, and prefers it
# for every key it mints, so two settings are needed:
#
#   auth_allowed_ciphers   aes256k,aes   permits AES-128 keys to exist
#   auth_preferred_cipher  aes           makes newly minted keys AES-128
#
# The preferred cipher has to be changed cluster-wide rather than passing
# --key-type AES to each get-or-create, because not every consumer is ours to
# call. In external mode the rook operator connects with the client.admin key
# it is handed and creates its own users -- client.csi-rbd-provisioner,
# client.csi-rbd-node, client.ceph-exporter -- with a plain get-or-create. Any
# of those born AES-256 makes ceph-csi fail every CreateVolume with
# "rados: ret=-22, Invalid argument", leaving every RBD PVC Pending while the
# StorageCluster still reports Ready. The list grows with each rook version,
# so it cannot be enumerated here.
#
# Both ciphers must stay in auth_allowed_ciphers: daemon keys minted before
# this change are AES-256, the ones minted after are AES-128, and mon/mgr/osd
# have to keep talking to their own -324 daemons either way.
#
# This knowingly downgrades the whole cluster to a cipher the new build labels
# insecure -- including future daemon keys, which previously stayed AES-256.
# It is the trade-off for tracking a moving :latest tag rather than pinning
# the image and freezing Ceph updates, and it is accepted deliberately for a
# lab. Set ceph_cephx_aes128_compat to false to drop the workaround once ODF
# ships a client that reads AES-256 -- that only affects fresh deploys, it
# does not roll an existing cluster back.

- name: Get monmap auth cipher configuration
  ansible.builtin.command: "{{ ceph_cmd }} mon dump -f json"
  register: ceph_compat_monmap
  changed_when: false

- name: Allow the AES-128 cipher alongside AES-256
  ansible.builtin.command: "{{ ceph_cmd }} mon set auth_allowed_ciphers aes256k,aes"
  when: >-
    'aes' not in (ceph_compat_monmap.stdout | from_json).auth_allowed_ciphers
    | map(attribute='name') | list
  changed_when: true

- name: Get current insecure-key setting
  ansible.builtin.command: "{{ ceph_cmd }} config get mon mon_auth_allow_insecure_key"
  register: ceph_compat_insecure_key
  changed_when: false

- name: Permit creation of AES-128 keys
  # Without this the mon refuses outright:
  # "creating key with insecure key type (aes) not allowed"
  ansible.builtin.command: "{{ ceph_cmd }} config set mon mon_auth_allow_insecure_key true"
  when: ceph_compat_insecure_key.stdout | trim | lower != 'true'
  changed_when: true

- name: Get the monmap preferred auth cipher
  # Re-dumped rather than reusing ceph_compat_monmap from the top of the file:
  # the allowed-ciphers task above may have rewritten the monmap since.
  ansible.builtin.command: "{{ ceph_cmd }} mon dump -f json"
  register: ceph_compat_preferred
  changed_when: false

- name: Prefer AES-128 for every newly created key
  # Covers the entities rook creates for itself, which never see the
  # --key-type AES that osd.yml and cephfs.yml pass explicitly.
  ansible.builtin.command: "{{ ceph_cmd }} mon set auth_preferred_cipher aes"
  when: >-
    (ceph_compat_preferred.stdout | from_json).auth_preferred_cipher.name != 'aes'
  changed_when: true

- name: Get current client.admin key
  ansible.builtin.command: "{{ ceph_cmd }} auth get-key client.admin"
  register: ceph_compat_admin_key
  changed_when: false
  no_log: true

- name: Re-key client.admin to AES-128
  # bootstrap already wrote an AES-256 admin key, so it has to be rotated
  # rather than created. AES-128 keys are "AQ..." in base64, AES-256 "Ag...".
  when: not ceph_compat_admin_key.stdout.startswith('AQ')
  block:
    - name: Get Ceph cluster FSID
      ansible.builtin.command: "{{ ceph_cmd }} fsid"
      register: ceph_compat_fsid
      changed_when: false

    - name: Rotate client.admin onto an AES-128 key
      ansible.builtin.command: "{{ ceph_cmd }} auth rotate client.admin --key-type AES"
      register: ceph_compat_admin_rotate
      changed_when: true
      no_log: true

    - name: Install the rotated admin keyring
      # cephadm authenticates from its own copy under the cluster config dir,
      # not from /etc/ceph, and redistributes it to hosts labelled _admin.
      # Leaving that copy stale locks `cephadm shell` out of the cluster.
      ansible.builtin.copy:
        content: "{{ ceph_compat_admin_rotate.stdout }}\n"
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - /etc/ceph/ceph.client.admin.keyring
        - "/var/lib/ceph/{{ ceph_compat_fsid.stdout | trim }}/config/ceph.client.admin.keyring"
      no_log: true

# Everything above is what makes the cluster usable; what follows is what
# makes it *look* healthy again. Since the 20.2.1-405 (9.1.2) image the mon
# raises three checks over precisely the state this file creates -- insecure
# cipher allowed, insecure key creation allowed, and one entry per client
# holding an AES-128 key. They are permanent by construction, there is no
# mon_warn_on_* option to switch them off, and they would pin the cluster at
# HEALTH_WARN: the CephFS gate in cephfs.yml and the pre-shutdown gate in
# playbooks/shutdown.yml both refuse anything but HEALTH_OK, so `make deploy`
# and `make shutdown` would never pass again. Mute them, and let both gates
# match on the leading status word -- a muted cluster reports
# "HEALTH_OK (muted: AUTH_INSECURE_CLIENT_KEY_TYPE ...)".

- name: Wait for the insecure-key health checks to be raised
  # Deliberately fatal: with the compat workaround on, this image raises all
  # three within seconds of the settings above. A timeout means the mon did
  # not take the downgrade, which is worth failing over here rather than
  # three stages later. An image predating these checks never raises them --
  # set ceph_cephx_insecure_health_checks to [] for that case.
  ansible.builtin.command: "{{ ceph_cmd }} health -f json"
  register: ceph_compat_health
  until: >-
    ceph_cephx_insecure_health_checks
    | difference((ceph_compat_health.stdout | from_json).checks.keys() | list)
    | length == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Mute the insecure-key health warnings
  # --sticky is not optional. A plain mute is cleared automatically as soon as
  # the check gets worse, and AUTH_INSECURE_CLIENT_KEY_TYPE counts entities:
  # rook mints client.csi-rbd-provisioner, client.csi-rbd-node and
  # client.ceph-exporter of its own in stage 09, taking the count from 4 to 7
  # and un-muting the check right after the deploy declared success.
  #
  # The loop skips codes that already carry a sticky mute, so a re-run is a
  # no-op; a mute that lost its stickiness is re-applied.
  ansible.builtin.command: "{{ ceph_cmd }} health mute {{ item }} --sticky"
  loop: >-
    {{ ceph_cephx_insecure_health_checks
       | intersect((ceph_compat_health.stdout | from_json).checks.keys() | list)
       | difference((ceph_compat_health.stdout | from_json).mutes | default([])
                    | selectattr('sticky', 'defined') | selectattr('sticky')
                    | map(attribute='code') | list) }}
  changed_when: true
