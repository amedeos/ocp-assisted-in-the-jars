---
- name: Install cephadm
  ansible.builtin.include_tasks: install_cephadm.yml

- name: Bootstrap Ceph cluster
  ansible.builtin.include_tasks: bootstrap.yml

- name: Allow AES-128 cephx keys for ODF compatibility
  ansible.builtin.include_tasks: cephx_compat.yml
  when: ceph_cephx_aes128_compat | bool

- name: Mark OSD devices as SSD via udev
  ansible.builtin.include_tasks: udev_ssd.yml

- name: Configure OSDs and storage pool
  ansible.builtin.include_tasks: osd.yml

- name: Configure CephFS filesystem for RWX volumes
  # After osd.yml: the CephFS pools reuse the replicated_ssd CRUSH rule it
  # creates, and the MDS needs the OSDs up.
  ansible.builtin.include_tasks: cephfs.yml
  when: enable_cephfs | bool
