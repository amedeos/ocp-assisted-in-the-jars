---
ceph_osd_devices:
  - /dev/vdb
  - /dev/vdc
  - /dev/vdd
ceph_client_name: client.openshift

# CephX entities for the CephFS CSI driver. These names are not free choice:
# the userID ODF puts in the CSI secret is the entity minus its "client."
# prefix, and ceph-csi re-prefixes it. Renaming them means diverging from
# every upstream doc and troubleshooting article.
ceph_cephfs_provisioner_client: client.csi-cephfs-provisioner
ceph_cephfs_node_client: client.csi-cephfs-node

# Make the cluster mint AES-128 cephx keys instead of the AES-256 the current
# rhceph-9 image defaults to. ODF's bundled Ceph client is an older build that
# cannot parse AES-256 keys: the StorageCluster gets stuck in phase Error, or
# reaches Ready while every RBD PVC stays Pending. This applies cluster-wide,
# not just to the entities this role creates, because rook mints its own CSI
# users in external mode. See cephx_compat.yml for the full rationale and the
# security trade-off. Set to false once ODF ships a client that keeps pace
# with the container image.
ceph_cephx_aes128_compat: true

# BlueStore slow-ops alerting. On the lab's virtual (qcow2) OSD disks a
# slow RocksDB commit (slow_committed_kv) is routine, so the upstream
# defaults (threshold 1, 24h window) keep the cluster permanently in
# HEALTH_WARN and drown out real problems. A threshold of 10 was still
# tripped within hours, so raise it far above any plausible lab rate and
# shrink the window to 1h.
#
# This effectively silences BLUESTORE_SLOW_OP_ALERT -- acceptable here
# because the underlying latency is an artefact of file-backed virtual
# disks, not of Ceph. On real hardware, lower these back towards the
# upstream defaults.
ceph_bluestore_slow_ops_warn_threshold: 1000
# Rolling window (seconds) over which slow ops are counted.
ceph_bluestore_slow_ops_warn_lifetime: 3600

_ceph_slow_ops_settings:
  bluestore_slow_ops_warn_threshold: "{{ ceph_bluestore_slow_ops_warn_threshold }}"
  bluestore_slow_ops_warn_lifetime: "{{ ceph_bluestore_slow_ops_warn_lifetime }}"
