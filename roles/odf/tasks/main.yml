---
- name: Detect cluster version for ODF channel
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      get clusterversion version
      -o jsonpath='{.status.history[0].version}'
  register: odf_cluster_version
  changed_when: false

- name: Set ODF channel from cluster version
  ansible.builtin.set_fact:
    odf_channel: "stable-{{ odf_cluster_version.stdout.split('.')[:2] | join('.') }}"
  when: odf_channel_override is not defined

- name: Use user-defined ODF channel override
  ansible.builtin.set_fact:
    odf_channel: "{{ odf_channel_override }}"
  when: odf_channel_override is defined

- name: Display ODF channel
  ansible.builtin.debug:
    msg: "ODF channel: {{ odf_channel }} (cluster version: {{ odf_cluster_version.stdout }})"

- name: Get Ceph FSID
  ansible.builtin.command: "{{ ceph_cmd }} fsid"
  register: odf_ceph_fsid_result
  changed_when: false
  delegate_to: ceph

- name: Get CephX key for OpenShift
  ansible.builtin.command: "{{ ceph_cmd }} auth get-key {{ odf_ceph_client_name }}"
  register: odf_ceph_key_result
  changed_when: false
  delegate_to: ceph
  no_log: true

- name: Get Ceph admin key
  ansible.builtin.command: "{{ ceph_cmd }} auth get-key client.admin"
  register: odf_ceph_admin_key_result
  changed_when: false
  delegate_to: ceph
  no_log: true

- name: Get CephX key for the CephFS CSI provisioner
  ansible.builtin.command: "{{ ceph_cmd }} auth get-key {{ odf_cephfs_provisioner_client }}"
  register: odf_cephfs_provisioner_key_result
  changed_when: false
  delegate_to: ceph
  no_log: true
  when: enable_cephfs | bool

- name: Get CephX key for the CephFS CSI node plugin
  ansible.builtin.command: "{{ ceph_cmd }} auth get-key {{ odf_cephfs_node_client }}"
  register: odf_cephfs_node_key_result
  changed_when: false
  delegate_to: ceph
  no_log: true
  when: enable_cephfs | bool

- name: Set Ceph connection facts
  ansible.builtin.set_fact:
    odf_ceph_fsid: "{{ odf_ceph_fsid_result.stdout }}"
    odf_ceph_key: "{{ odf_ceph_key_result.stdout }}"
    odf_ceph_admin_key: "{{ odf_ceph_admin_key_result.stdout }}"
    odf_ceph_mon_ip: "{{ (cluster_nodes | selectattr('role', 'eq', 'ceph') | first).ip }}"

- name: Set CephFS connection facts
  ansible.builtin.set_fact:
    odf_cephfs_provisioner_key: "{{ odf_cephfs_provisioner_key_result.stdout }}"
    odf_cephfs_node_key: "{{ odf_cephfs_node_key_result.stdout }}"
  when: enable_cephfs | bool
  no_log: true

- name: Create openshift-storage namespace
  ansible.builtin.command:
    cmd: "oc --kubeconfig {{ odf_kubeconfig_path }} create namespace {{ odf_namespace }}"
  register: odf_ns_create
  changed_when: "'created' in odf_ns_create.stdout"
  failed_when: odf_ns_create.rc != 0 and 'already exists' not in odf_ns_create.stderr

- name: Apply OperatorGroup
  ansible.builtin.command:
    cmd: "oc --kubeconfig {{ odf_kubeconfig_path }} apply -f -"
    stdin: "{{ lookup('template', 'operator-group.yml.j2') }}"
  register: odf_og_apply
  changed_when: "'created' in odf_og_apply.stdout or 'configured' in odf_og_apply.stdout"

- name: Apply Subscription
  ansible.builtin.command:
    cmd: "oc --kubeconfig {{ odf_kubeconfig_path }} apply -f -"
    stdin: "{{ lookup('template', 'subscription.yml.j2') }}"
  register: odf_sub_apply
  changed_when: "'created' in odf_sub_apply.stdout or 'configured' in odf_sub_apply.stdout"

- name: Wait for ODF operator to be ready
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      get csv -n {{ odf_namespace }}
      -o jsonpath='{.items[?(@.spec.displayName=="OpenShift Data Foundation")].status.phase}'
  register: odf_csv_status
  until: odf_csv_status.stdout == 'Succeeded'
  retries: 60
  delay: 15
  changed_when: false

- name: Apply Ceph CephFS secrets
  # Applied before the connection secret, unlike the RBD ones: ocs-operator
  # creates these same Secrets from the JSON as type Opaque, and a Secret's
  # type is immutable, so on an already-reconciled cluster applying them
  # afterwards would fail with "field is immutable".
  ansible.builtin.command:
    cmd: "oc --kubeconfig {{ odf_kubeconfig_path }} apply -f -"
    stdin: "{{ lookup('template', 'ceph-cephfs-secret.yml.j2') }}"
  register: odf_cephfs_secret_apply
  changed_when: >-
    'created' in odf_cephfs_secret_apply.stdout or
    'configured' in odf_cephfs_secret_apply.stdout
  when: enable_cephfs | bool
  no_log: true

- name: Apply Ceph connection secret
  ansible.builtin.command:
    cmd: "oc --kubeconfig {{ odf_kubeconfig_path }} apply -f -"
    stdin: "{{ lookup('template', 'ceph-connection.yml.j2') }}"
  register: odf_conn_apply
  changed_when: "'created' in odf_conn_apply.stdout or 'configured' in odf_conn_apply.stdout"
  no_log: true

- name: Apply Ceph RBD secrets
  ansible.builtin.command:
    cmd: "oc --kubeconfig {{ odf_kubeconfig_path }} apply -f -"
    stdin: "{{ lookup('template', 'ceph-rbd-secret.yml.j2') }}"
  register: odf_secret_apply
  changed_when: "'created' in odf_secret_apply.stdout or 'configured' in odf_secret_apply.stdout"
  no_log: true

- name: Wait for StorageCluster CRD to be available
  ansible.builtin.command:
    cmd: "oc --kubeconfig {{ odf_kubeconfig_path }} get crd storageclusters.ocs.openshift.io"
  register: odf_crd_check
  until: odf_crd_check.rc == 0
  retries: 60
  delay: 15
  changed_when: false

- name: Apply StorageCluster (external mode)
  ansible.builtin.command:
    cmd: "oc --kubeconfig {{ odf_kubeconfig_path }} apply -f -"
    stdin: "{{ lookup('template', 'storage-cluster.yml.j2') }}"
  register: odf_sc_apply
  changed_when: "'created' in odf_sc_apply.stdout or 'configured' in odf_sc_apply.stdout"

- name: Compute the external-details revision
  ansible.builtin.set_fact:
    odf_details_revision: "{{ lookup('template', 'ceph-connection.yml.j2') | hash('sha1') }}"

- name: Get the recorded external-details revision
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      get storagecluster ocs-external-storagecluster
      -n {{ odf_namespace }}
      -o jsonpath="{.metadata.annotations['{{ odf_details_revision_annotation }}']}"
  register: odf_sc_current_revision
  changed_when: false
  failed_when: false

- name: Trigger a StorageCluster reconcile for the external details
  # ocs-operator re-reads rook-ceph-external-cluster-details on every
  # reconcile but does not watch it: its Owns(&corev1.Secret{}) is filtered
  # by GenerationChangedPredicate, and Secrets have no generation. The
  # StorageCluster's own predicate does include MetadataChangedPredicate, so
  # bumping an annotation is a reliable trigger. Without this a changed
  # secret would only take effect at the 10h resync. Hashing the rendered
  # template keeps the task idempotent, and ungating it means the same
  # applies the day the RBD side of the secret changes.
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      annotate storagecluster ocs-external-storagecluster
      -n {{ odf_namespace }}
      {{ odf_details_revision_annotation }}={{ odf_details_revision }}
      --overwrite
  register: odf_sc_reconcile
  # "annotate --overwrite" reports "annotated" even when the value is
  # unchanged, so gate on the stored value instead of on its output.
  when: odf_sc_current_revision.stdout | default('') != odf_details_revision
  changed_when: true

- name: Wait for StorageCluster to be ready
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      get storagecluster ocs-external-storagecluster
      -n {{ odf_namespace }}
      -o jsonpath='{.status.phase}'
  register: odf_sc_status
  until: odf_sc_status.stdout == 'Ready'
  retries: 60
  delay: 15
  changed_when: false

- name: Get the enabled console plugins
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      get console.operator.openshift.io cluster
      -o jsonpath='{.spec.plugins}'
  register: odf_console_plugins
  changed_when: false

- name: Enable ODF console plugin
  # Guarded on the current list: "add /spec/plugins/-" appends
  # unconditionally, so an unguarded re-run grows a list of duplicate
  # odf-console entries.
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      patch console.operator.openshift.io cluster
      --type json
      --patch '[{"op": "add", "path": "/spec/plugins/-", "value": "odf-console"}]'
  register: odf_console_plugin
  when: "'odf-console' not in (odf_console_plugins.stdout | default('[]', true) | from_json)"
  changed_when: "'patched' in odf_console_plugin.stdout"
  failed_when: >-
    odf_console_plugin.rc != 0 and
    'already exists' not in odf_console_plugin.stderr | default('')

- name: Set CephRBD StorageClass as default
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      annotate storageclass ocs-external-storagecluster-ceph-rbd
      storageclass.kubernetes.io/is-default-class=true
      --overwrite
  register: odf_default_sc
  changed_when: "'annotated' in odf_default_sc.stdout | default('')"

- name: Wait for the CephFS StorageClass to appear
  # Created by ocs-operator from the "cephfs" entry in the external-cluster
  # secret. It carries no is-default-class annotation, so it does not
  # contend with the RBD class annotated above.
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      get storageclass {{ odf_cephfs_storage_class }}
  register: odf_cephfs_sc_check
  until: odf_cephfs_sc_check.rc == 0
  retries: 40
  delay: 15
  changed_when: false
  failed_when: false
  when: enable_cephfs | bool

- name: Fail if the CephFS StorageClass never appeared
  ansible.builtin.fail:
    msg: >-
      {{ odf_cephfs_storage_class }} was not created. Check that the "cephfs"
      entry reached the rook-ceph-external-cluster-details secret, and read
      the ocs-operator log in {{ odf_namespace }}.
  when:
    - enable_cephfs | bool
    - odf_cephfs_sc_check.rc | default(1) != 0

- name: Run the CephFS RWX smoke test
  ansible.builtin.include_tasks: cephfs_smoke_test.yml
  when:
    - enable_cephfs | bool
    - odf_cephfs_smoke_test | bool

- name: Wait for the NooBaa system to be ready
  # The StorageCluster reaches Ready as soon as the external CephCluster
  # connects, which says nothing about provisioning: a cluster whose RBD CSI
  # credentials are unusable sits at Ready with every PVC Pending. NooBaa is
  # the only stock consumer of the default RBD StorageClass, so waiting on it
  # doubles as an end-to-end check and needs no PVC of its own. It has to come
  # after the default-class annotation above, which is how its DB PVC resolves.
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      get noobaa {{ odf_noobaa_name }}
      -n {{ odf_namespace }}
      -o jsonpath='{.status.phase}'
  register: odf_noobaa_phase
  until: odf_noobaa_phase.stdout == 'Ready'
  retries: 60
  delay: 15
  changed_when: false
  failed_when: false

- name: Collect PVCs that never bound
  ansible.builtin.command:
    cmd: >-
      oc --kubeconfig {{ odf_kubeconfig_path }}
      get pvc -n {{ odf_namespace }}
      -o jsonpath='{range .items[?(@.status.phase!="Bound")]}{.metadata.name}={.status.phase} {end}'
  register: odf_unbound_pvcs
  changed_when: false
  failed_when: false
  when: odf_noobaa_phase.stdout | default('') != 'Ready'

- name: Fail if the NooBaa system never became ready
  ansible.builtin.fail:
    msg: >-
      NooBaa is in phase "{{ odf_noobaa_phase.stdout | default('') | default('unknown', true) }}".
      Unbound PVCs in {{ odf_namespace }}:
      {{ odf_unbound_pvcs.stdout | default('') | trim | default('none', true) }}.
      A Pending db-noobaa-db-pg-0 means RBD provisioning is failing. Read
      `oc logs -n {{ odf_namespace }} -l app=csi-rbdplugin-provisioner
      -c csi-rbdplugin`: "rados: ret=-22, Invalid argument" means the cephx
      keys in the rook-csi-rbd-provisioner and rook-csi-rbd-node secrets are
      AES-256 and ODF cannot parse them. See cephx_compat.yml in the ceph role.
  when: odf_noobaa_phase.stdout | default('') != 'Ready'

- name: Display StorageClasses
  ansible.builtin.command:
    cmd: "oc --kubeconfig {{ odf_kubeconfig_path }} get sc"
  register: odf_storage_classes
  changed_when: false

- name: Show available StorageClasses
  ansible.builtin.debug:
    var: odf_storage_classes.stdout_lines
