---
- name: Start utility VM and verify DNS
  hosts: hypervisors
  become: true
  gather_facts: false
  tasks:
    - name: Start utility VM  # noqa: run-once[task]
      community.libvirt.virt:
        name: "{{ item.name }}"
        state: running
      loop: "{{ utility_nodes }}"
      delegate_to: "{{ item.hypervisor }}"
      run_once: true

    - name: Wait for utility VM SSH  # noqa: run-once[task]
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        delay: 5
        timeout: 120
      loop: "{{ utility_nodes }}"
      run_once: true
      become: false

- name: Verify dnsmasq is running
  hosts: utility_vms
  become: true
  gather_facts: false
  tasks:
    - name: Wait for dnsmasq to be running
      ansible.builtin.service_facts:
      register: startup_service_facts
      until: >-
        startup_service_facts.ansible_facts.services['dnsmasq.service'] is defined and
        startup_service_facts.ansible_facts.services['dnsmasq.service'].state == 'running'
      retries: 30
      delay: 5

- name: Start ceph VM and verify health
  hosts: hypervisors
  become: true
  gather_facts: false
  tasks:
    - name: Start ceph VM  # noqa: run-once[task]
      community.libvirt.virt:
        name: "{{ item.name }}"
        state: running
      loop: "{{ ceph_nodes }}"
      delegate_to: "{{ item.hypervisor }}"
      run_once: true

    - name: Wait for ceph VM SSH  # noqa: run-once[task]
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 22
        delay: 5
        timeout: 120
      loop: "{{ ceph_nodes }}"
      run_once: true
      become: false

- name: Verify Ceph health
  hosts: ceph_vms
  become: true
  gather_facts: false
  tasks:
    - name: Wait for Ceph to be healthy
      ansible.builtin.command:
        cmd: "{{ ceph_cmd }} health"
      register: startup_ceph_health
      until: startup_ceph_health.stdout | trim in ['HEALTH_OK', 'HEALTH_WARN']
      retries: 60
      delay: 10
      changed_when: false

    - name: Display Ceph status
      ansible.builtin.command:
        cmd: "{{ ceph_cmd }} -s"
      register: startup_ceph_status
      changed_when: false

    - name: Show Ceph status
      ansible.builtin.debug:
        var: startup_ceph_status.stdout_lines

- name: Start control-plane VMs
  hosts: hypervisors
  become: true
  gather_facts: false
  tasks:
    - name: Eject discovery ISO from control-plane VMs  # noqa: run-once[task]
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          cdrom_target=$(virsh domblklist {{ item.name }} --details | awk '$2 == "cdrom" { print $3 }') &&
          cdrom_source=$(virsh domblklist {{ item.name }} --details | awk '$2 == "cdrom" { print $4 }') &&
          if [ -n "$cdrom_target" ] && [ -n "$cdrom_source" ] && [ "$cdrom_source" != "-" ]; then
            virsh change-media {{ item.name }} "$cdrom_target" --eject --force --config 2>/dev/null || true;
            echo "EJECTED";
          else
            echo "EMPTY";
          fi
      loop: "{{ controlplane_nodes }}"
      delegate_to: "{{ item.hypervisor }}"
      register: startup_iso_eject
      changed_when: "'EJECTED' in startup_iso_eject.stdout"
      run_once: true

    - name: Start control-plane VMs  # noqa: run-once[task]
      community.libvirt.virt:
        name: "{{ item.name }}"
        state: running
      loop: "{{ controlplane_nodes }}"
      delegate_to: "{{ item.hypervisor }}"
      run_once: true

- name: Verify OpenShift cluster is ready
  hosts: utility_vms
  become: true
  gather_facts: false
  vars:
    startup_kubeconfig_path: /root/kubeconfig-int
    startup_co_total_timeout: 1800    # overall timeout in seconds (30 min)
    startup_co_poll_interval: 15      # seconds between polls
    startup_co_stable_threshold: 20  # consecutive stable checks required (5 min)
  tasks:
    - name: Wait for API VIP to be reachable
      ansible.builtin.wait_for:
        host: "{{ vip.api }}"
        port: 6443
        delay: 30
        timeout: 600
      become: false

    - name: Start background CSR approver
      ansible.builtin.include_role:
        name: csr_approver
      vars:
        csr_approver_kubeconfig: "{{ startup_kubeconfig_path }}"

    - name: Wait for valid cluster version
      ansible.builtin.command:
        cmd: >-
          oc --kubeconfig {{ startup_kubeconfig_path }}
          get clusterversion version
          -o jsonpath='{.status.history[0].version}'
      register: startup_cv
      until: >-
        startup_cv.rc == 0 and
        startup_cv.stdout is regex('^4\.\d+\.\d+$')
      retries: 60
      delay: 10
      changed_when: false
      failed_when: false

    - name: Display cluster version
      ansible.builtin.debug:
        msg: "Cluster version: {{ startup_cv.stdout | default('not available') }}"

    - name: Initialise stability counter
      ansible.builtin.set_fact:
        startup_co_stable_count: 0

    - name: Poll cluster operators with stability window (max 30 min, need 5 min stable)
      ansible.builtin.include_tasks: tasks/co_stability.yml
      loop: "{{ range(0, (startup_co_total_timeout | int // startup_co_poll_interval | int) + 1) | list }}"
      loop_control:
        loop_var: startup_co_iter

    - name: Fail if cluster operators never reached stability
      ansible.builtin.fail:
        msg: >-
          Timed out after {{ startup_co_total_timeout }}s: cluster operators
          did not remain stable for {{ startup_co_stable_threshold }} consecutive
          checks. Last stable streak: {{ startup_co_stable_count }}.
      when: startup_co_stable_count | int < startup_co_stable_threshold

    - name: Display cluster readiness
      ansible.builtin.debug:
        msg: "OpenShift cluster is ready — version {{ startup_cv.stdout }}, all operators Available."

    - name: Check if CSR approver is still running
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          ps -p {{ csr_approver_pid.stdout | trim }} > /dev/null 2>&1 &&
          echo RUNNING || echo STOPPED
      register: startup_csr_approver_status
      changed_when: false
      failed_when: false
      when: csr_approver_pid is defined

    - name: Display CSR approver final status
      ansible.builtin.debug:
        msg: >-
          CSR approver {{ startup_csr_approver_status.stdout | default('UNKNOWN') | trim }}
          (log {{ csr_approver_log | default('/var/log/csr-approver.log') }})
      when: csr_approver_pid is defined
